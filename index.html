<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Communauté</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #0f111a; color: #fff; min-height: 100vh; }

        /* --- NAVIGATION SUPÉRIEURE (MENU EN HAUT) --- */
        .top-nav {
            background-color: #121420;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e45;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-menu { display: flex; gap: 15px; }
        .nav-btn { background: none; border: none; color: #a0a5c0; cursor: pointer; padding: 8px; }
        .nav-btn.active { color: #fff; border-bottom: 2px solid #5865F2; }

        /* --- RESPONSIVITÉ POUR TÉLÉPHONE --- */
        .app-container { padding: 20px; max-width: 1200px; margin: auto; }
        
        @media (max-width: 600px) {
            .top-nav { flex-direction: column; text-align: center; }
            .nav-menu { gap: 5px; }
            .founder-panel-box > div { grid-template-columns: 1fr !important; }
        }

        /* --- RESTE DU STYLE --- */
        .view-section { display: none; }
        .view-section.active { display: block; }
        .update-box, .announcements-box { background: #1a1d2e; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        
        /* Contrôles masqués */
        .admin-only, .founder-only, .logged-in-only { display: none; }
        
        /* Boutons */
        .btn-save { background: #5865F2; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- MENU EN HAUT -->
    <nav class="top-nav">
        <div style="font-weight: bold; color: #5865F2;">Espace Communauté</div>
        <div class="nav-menu">
            <button class="nav-btn active" onclick="switchView('dashboard', this)">Dashboard</button>
            <button class="nav-btn" onclick="switchView('credits', this)">Crédits</button>
            <button id="btnLoginNav" class="nav-btn" onclick="openAdminModal()">Connexion</button>
            <button id="btnLogoutNav" class="logged-in-only nav-btn" onclick="logoutStaff()" style="color: #f23f43;">Déconnexion</button>
        </div>
        <div id="maintenanceBadge" style="background: #23a55a; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">Statut : Public</div>
    </nav>

    <div class="app-container">
        <!-- Dashboard -->
        <div id="view-dashboard" class="view-section active">
            <h1>Bienvenue</h1>
            <div class="update-box">
                <p>Contenu principal ici...</p>
                <div class="founder-only">
                    <button class="btn-save" onclick="toggleMaintenance()">Toggle Maintenance</button>
                </div>
            </div>
        </div>

        <!-- Credits -->
        <div id="view-credits" class="view-section">
            <h1>Crédits</h1>
        </div>
    </div>

    <script>
        let userRole = null;

        function switchView(viewId, btn) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            btn.classList.add('active');
        }

        // Simuler connexion
        function openAdminModal() {
            userRole = 'founder'; // Test auto
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            document.querySelectorAll('.founder-only').forEach(el => el.style.display = 'block');
            document.querySelectorAll('.logged-in-only').forEach(el => el.style.display = 'block');
            document.getElementById('btnLoginNav').style.display = 'none';
        }

        function toggleMaintenance() {
            const badge = document.getElementById('maintenanceBadge');
            if(badge.innerText.includes('Public')) {
                badge.innerText = "Statut : Maintenance";
                badge.style.background = "#f23f43";
            } else {
                badge.innerText = "Statut : Public";
                badge.style.background = "#23a55a";
            }
        }
        
        function logoutStaff() { location.reload(); }
    </script>
</body>
</html>
